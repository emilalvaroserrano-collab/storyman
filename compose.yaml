services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: storyman
      POSTGRES_USER: storyman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for Docker}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storyman -d storyman"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    ports: ["127.0.0.1:3210:3000"]
    env_file: .env
    environment: &app-environment
      DATABASE_URL: postgresql://storyman:${POSTGRES_PASSWORD}@postgres:5432/storyman
      STORYMAN_DATA_DIR: /app/data
      DATA_DIR: /app/data
      STORAGE_DIR: /app/data/artifacts
      APP_URL: ${APP_URL:-http://localhost:3210}
      OWNER_PASSWORD: ${OWNER_PASSWORD:?Set OWNER_PASSWORD in .env for Docker}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env for Docker}
      ENABLE_LIVE_PUBLISHING: "false"
    volumes: ["storyman-data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  worker:
    build: .
    command: ["node", "--import", "tsx", "scripts/worker.ts"]
    env_file: .env
    environment: *app-environment
    volumes: ["storyman-data:/app/data"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  # Optional infrastructure for a future BullMQ migration; current queue is SQL.
  redis:
    image: redis:7-alpine
    profiles: ["future-bullmq"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    restart: unless-stopped
volumes:
  storyman-data:
  postgres-data:
  redis-data:
